name: location_tracks_devcontainer

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ..:/workspaces:cached

    working_dir: /workspaces

    # Start the backend automatically, including when Compose is used without an IDE.
    command: sh -c "composer install --no-interaction && exec symfony serve --no-tls --port=8000"

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db

    environment:
      # Database connection settings for the app container.
      DATABASE_URL: "mysql://root:mariadb@db:3306/mariadb?serverVersion=10.6.27-MariaDB&charset=utf8mb4"

    depends_on:
        db:
            condition: service_healthy

    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: ghcr.io/mariadb/mariadb:10.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:4180:4180"
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: mariadb
      MYSQL_DATABASE: mariadb
      MYSQL_USER: mariadb
      MYSQL_PASSWORD: mariadb

    healthcheck:
        test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 10s

    # Add "forwardPorts": ["3306"] to **devcontainer.json** to forward MariaDB locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

volumes:
  mariadb-data:
