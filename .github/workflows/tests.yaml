name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: PHP 8.5 / MariaDB 10.6
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DATABASE_URL: 'mysql://test:test@127.0.0.1:3306/location_tracks?serverVersion=10.6.27-MariaDB&charset=utf8mb4'
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: location_tracks_test
          MARIADB_USER: test
          MARIADB_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=10s
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, pdo_mysql, mbstring, dom, xml, xmlwriter, intl
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply migrations to MariaDB 10.6
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction
      - name: Validate container and configuration
        run: |
          php bin/console lint:container --env=test
          php bin/console lint:yaml config/ .github/workflows/ compose.test.yaml --env=test
          php bin/console lint:twig templates/ --env=test
      - name: Run unit, integration and application tests
        run: php bin/phpunit --colors=always
